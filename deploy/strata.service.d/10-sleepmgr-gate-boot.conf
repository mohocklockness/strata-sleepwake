[Unit]
# Make a successful fail-closed boot seal a prerequisite for Strata accepting
# remote inference.  ``sleepmgr-gate-boot.service`` always runs at boot: it
# exits 0 when no seal marker exists (a clean boot needs no boot seal) and
# non-zero when a marker is present but the required blocking rule cannot be
# established or verified.  ``Requires=`` + ``After=`` means a failed seal stops
# strata.service from starting at all, so it cannot serve remote inference; a
# clean boot is unaffected.
#
# This drop-in never touches host networking: the boot unit only manages the
# ``inet sleepmgr_gate`` table for the configured inference port, so SSH and
# other services stay available for troubleshooting even when Strata is held
# back.  Installed only by ``install.sh --with-gate``; remove just this file
# (not the whole directory) to roll the dependency back.
Requires=sleepmgr-gate-boot.service
After=sleepmgr-gate-boot.service
